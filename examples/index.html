<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVG Canvas — Example</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- Top Toolbar -->
  <div id="top-toolbar" class="toolbar top-toolbar">
    <div class="toolbar-section">
      <span class="section-label">Snap</span>
      <button id="btn-snap-corners" data-toggle title="Snap to Corners">📐 Corners</button>
      <button id="btn-snap-planes" data-toggle title="Snap to Planes">📏 Planes</button>
      <button id="btn-snap-artboard" data-toggle title="Snap to Artboard">🖼️ Artboard</button>
      <button id="btn-snap-guidelines" data-toggle title="Snap to Guidelines">📌 Guidelines</button>
      <button id="btn-snap-grid" data-toggle title="Snap to Grid">🔲 Grid</button>
      <button id="btn-snap-elements" data-toggle title="Snap to Element">🧲 Element</button>
      <button id="btn-avoid-collisions" data-toggle title="Avoid Collisions">🚫 Collide</button>
      <button id="btn-lock-drag-axis" data-toggle title="Lock Drag Axis">↕️ Axis Lock</button>
    </div>
    <div class="toolbar-section">
      <span class="section-label">Snap Axis</span>
      <select id="sel-snap-axis" title="Snap Axis">
        <option value="both">Both</option>
        <option value="horizontal">H</option>
        <option value="vertical">V</option>
      </select>
    </div>
    <div class="toolbar-section">
      <span class="section-label">Transform</span>
      <button id="btn-transform-resize" title="Resize Mode">↔️ Resize</button>
      <button id="btn-transform-rotate" title="Rotate Mode">🔄 Rotate</button>
      <button id="btn-proportional-resize" data-toggle title="Proportional Resize">🔒 Proportional</button>
    </div>
    <div class="toolbar-section">
      <span class="section-label">View</span>
      <button id="btn-pan-mode" data-toggle title="Pan Mode">✋ Pan</button>
      <button id="btn-toggle-rulers" data-toggle title="Toggle Rulers">📐 Rulers</button>
      <button id="btn-toggle-grid" data-toggle title="Toggle Grid">🔲 Grid</button>
      <span class="grid-step-group">
        <label>Step:</label>
        <input id="input-grid-step" type="number" value="10" min="1" max="100" step="1" title="Grid Step (mm)" />
      </span>
    </div>
    <div class="toolbar-section">
      <span class="section-label">Boolean</span>
      <button id="btn-bool-union" title="Boolean Union">∪ Union</button>
      <button id="btn-bool-intersect" title="Boolean Intersect">∩ Intersect</button>
      <button id="btn-bool-diff" title="Boolean Difference">− Diff</button>
      <button id="btn-bool-exit" title="Exit Boolean Mode" style="display:none">✕ Exit</button>
    </div>
    <div class="toolbar-section">
      <span class="section-label">Debug</span>
      <button id="btn-debug-hitarea" data-toggle title="Show Hit Areas">🎯 HitArea</button>
      <button id="btn-preloader" title="Show/Hide Preloader">⏳ Preloader</button>
    </div>
  </div>

  <div id="main-layout">
    <!-- Left Toolbar -->
    <div id="left-toolbar" class="toolbar left-toolbar">
      <div class="toolbar-section">
        <span class="section-label">Tools</span>
        <button id="btn-sel-element" class="tool-mode active" title="Select Element (V)">🖱️ Elem</button>
        <button id="btn-sel-group" class="tool-mode" title="Select Group (G)">📦 Group</button>
        <div class="toolbar-subsection">
          <span class="sub-label">Gesture</span>
          <button id="btn-gesture-click" class="gesture-btn active" title="Click to select">👆 Click</button>
          <button id="btn-gesture-rect" class="gesture-btn" title="Rectangle selection">⬜ Rect</button>
          <button id="btn-gesture-lasso" class="gesture-btn" title="Lasso selection">✏️ Lasso</button>
        </div>
        <button id="btn-creation-rect" class="creation-tool" data-type="rect" title="Rectangle">⬜ Rect</button>
        <button id="btn-creation-circle" class="creation-tool" data-type="circle" title="Circle">⚫ Circle</button>
        <button id="btn-creation-ellipse" class="creation-tool" data-type="ellipse" title="Ellipse">🔵 Ellipse</button>
        <button id="btn-creation-line" class="creation-tool" data-type="line" title="Line">📏 Line</button>
        <button id="btn-creation-path" class="creation-tool" data-type="path" title="Path">✏️ Path</button>
        <button id="btn-creation-polygon" class="creation-tool" data-type="polygon" title="Polygon">⬠ Polygon</button>
        <button id="btn-creation-polyline" class="creation-tool" data-type="polyline" title="Polyline">📐 Pline</button>
        <button id="btn-creation-cancel" class="creation-tool cancel" title="Cancel Creation" style="display:none">🚫 Cancel</button>
      </div>
      <div class="toolbar-section">
        <span class="section-label">Actions</span>
        <button id="btn-undo" title="Undo (Ctrl+Z)">↩️ Undo</button>
        <button id="btn-redo" title="Redo (Ctrl+Shift+Z)">↪️ Redo</button>
        <button id="btn-delete" title="Delete Selected">🗑️ Delete</button>
        <button id="btn-outline" title="Outline Element">✂️ Outline</button>
      </div>
      <div class="toolbar-section">
        <span class="section-label">Selection</span>
        <button id="btn-sel-all" title="Select All">✅ All</button>
        <button id="btn-sel-none" title="Clear Selection">❎ None</button>
      </div>
      <div class="toolbar-section">
        <span class="section-label">Style</span>
        <div class="style-row">
          <label>Fill</label>
          <input id="input-fill" type="color" value="#3498db" />
        </div>
        <div class="style-row">
          <label>Stroke</label>
          <input id="input-stroke" type="color" value="#2c3e50" />
        </div>
        <div class="style-row">
          <label>Width</label>
          <input id="input-stroke-width" type="number" value="2" min="0" max="20" step="0.5" />
        </div>
        <button id="btn-apply-style">🎨 Apply Style</button>
      </div>
    </div>

    <!-- Canvas Area -->
    <div id="canvas-container"></div>

    <!-- Right Panel -->
    <div id="right-panel">
      <div id="groups-panel" class="right-block">
        <h3>📦 Groups</h3>
        <div class="group-actions">
          <button id="btn-group-create">+ Create</button>
          <button id="btn-group-delete">✕ Delete</button>
          <input id="input-group-name" type="text" placeholder="Group name" value="New Group" />
        </div>
        <div class="group-actions">
          <button id="btn-group-add-elem">+ Add Sel</button>
          <button id="btn-group-rem-elem">− Rem Sel</button>
        </div>
        <ul id="group-list"></ul>
      </div>
      <div id="event-log-panel" class="right-block">
        <h3>📋 Events</h3>
        <div class="event-controls">
          <button id="btn-log-clear">Clear</button>
          <label><input id="chk-log-pause" type="checkbox" /> Pause</label>
        </div>
        <div id="event-log"></div>
      </div>
    </div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
