<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVG Canvas Example</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #ddd; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    #toolbar {
      display: flex; align-items: center; gap: 6px; padding: 4px 8px;
      background: #2a2a2a; border-bottom: 1px solid #444;
      flex-wrap: wrap;
    }
    #toolbar button {
      background: #3a3a3a; color: #ddd; border: 1px solid #555;
      padding: 4px 10px; cursor: pointer; font-size: 13px; border-radius: 3px;
    }
    #toolbar button:hover { background: #4a4a4a; }
    #toolbar button.active { background: #4285f4; border-color: #4285f4; color: #fff; }
    #toolbar select {
      background: #3a3a3a; color: #ddd; border: 1px solid #555;
      padding: 4px 6px; font-size: 13px; border-radius: 3px;
    }
    #main-area { display: flex; flex: 1; min-height: 0; }
    #canvas-area { flex: 1; position: relative; min-width: 0; display: flex; }
    #canvas-container { position: absolute; inset: 0; }
    #side-panel {
      width: 280px; display: flex; flex-direction: column;
      background: #2a2a2a; border-left: 1px solid #444;
    }
    #group-section { padding: 8px; border-bottom: 1px solid #444; }
    #group-section .label { color: #888; font-size: 12px; margin-bottom: 4px; }
    #group-list { max-height: 180px; overflow-y: auto; margin-bottom: 6px; }
    .group-item {
      padding: 3px 6px; cursor: pointer; font-size: 12px; border-radius: 3px;
    }
    .group-item:hover { background: #3a3a3a; }
    .group-item.active { background: #4285f4; color: #fff; }
    #group-section .btn-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
    #group-section button, #group-section select {
      background: #3a3a3a; color: #ddd; border: 1px solid #555;
      padding: 3px 8px; cursor: pointer; font-size: 12px; border-radius: 3px;
    }
    #group-section select { flex: 1; }
    #info-bar { flex: 1; padding: 8px; overflow-y: auto; }
    #info { white-space: pre-wrap; font-size: 12px; color: #aaa; }
  </style>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <span style="color:#888;font-size:12px">Mode:</span>
      <button id="btn-mode-element">● Element</button>
      <button id="btn-mode-group">○ Group</button>
      <span style="color:#888;font-size:12px;margin-left:8px">|</span>
      <button id="btn-gesture-click">Click</button>
      <button id="btn-gesture-rect">Rect</button>
      <button id="btn-gesture-lasso">Lasso</button>
      <span style="color:#888;font-size:12px;margin-left:8px">|</span>
      <span style="color:#888;font-size:12px">Transform:</span>
      <button id="btn-transform-resize">⊞ Resize</button>
      <button id="btn-transform-rotate">↻ Rotate</button>
      <button id="btn-transform-matrix">⟐ Matrix</button>
      <span style="color:#888;font-size:12px;margin-left:8px">|</span>
      <button id="btn-toggle-pan">Pan: off</button>
      <button id="btn-debug-hitarea">HitArea: off</button>
    </div>
    <div id="main-area">
      <div id="canvas-area">
        <div id="canvas-container"></div>
      </div>
      <div id="side-panel">
        <div id="group-section">
          <div class="label">Groups</div>
          <div id="group-list"></div>
          <div class="btn-row">
            <button id="btn-group-create">+ Create</button>
            <button id="btn-group-delete">− Delete</button>
            <button id="btn-group-clear">Clear</button>
            <button id="btn-group-select">Select all</button>
          </div>
          <div class="btn-row">
            <select id="group-select"><option value="">— no group —</option></select>
            <button id="btn-group-add">+ to group</button>
            <button id="btn-group-remove">− from group</button>
          </div>
          <div class="btn-row">
            <button id="btn-size-a4">A4</button>
            <button id="btn-size-a3">A3</button>
          </div>
        </div>
        <div id="info-bar">
          <div id="info"></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
