<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>svg-canvas sandbox</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; padding: 24px; font-family: monospace; }
    h1 { color: #eee; margin-bottom: 16px; font-size: 18px; }
    #app { border: 1px solid #444; border-radius: 8px; overflow: hidden; background: #fff; }
    #controls { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    button { padding: 6px 14px; border: none; border-radius: 6px; background: #4ecca3; color: #1a1a2e; font-weight: bold; cursor: pointer; font-size: 13px; }
    button:hover { opacity: 0.85; }
    #console { margin-top: 12px; width: 804px; max-width: 100%; height: 120px; background: #0f0f23; color: #4ecca3; border: 1px solid #333; border-radius: 6px; padding: 8px; font-size: 12px; overflow-y: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>svg-canvas sandbox</h1>
  <div id="app"></div>
  <div id="controls">
    <button id="btn-rect">+ Rect</button>
    <button id="btn-circle">+ Circle</button>
    <button id="btn-ellipse">+ Ellipse</button>
    <button id="btn-line">+ Line</button>
    <button id="btn-path">+ Path</button>
    <button id="btn-polygon">+ Polygon</button>
    <button id="btn-polyline">+ Polyline</button>
    <button id="btn-text">+ Text</button>
    <button id="btn-image">+ Image</button>
    <button id="btn-load-json">Load JSON</button>
    <button id="btn-clear">Clear</button>
    <button id="btn-size-a4">A4</button>
    <button id="btn-size-a3">A3</button>
  </div>
  <div id="console">// ready — click buttons to add shapes</div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
