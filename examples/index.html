<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>svg-canvas sandbox</title>
  <link rel="icon" href="data:,">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { height: 100%; overflow: hidden; }
    body { background: #1a1a2e; display: flex; font-family: monospace; }
    .left { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .right { width: 320px; display: flex; flex-direction: column; border-left: 1px solid #333; }
    #controls { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; border-bottom: 1px solid #333; }
    button { padding: 5px 10px; border: none; border-radius: 4px; background: #4ecca3; color: #1a1a2e; font-weight: bold; cursor: pointer; font-size: 12px; }
    button:hover { opacity: 0.85; }
    button.active { background: #ff8c00; color: #fff; }
    #app { flex: 1; min-height: 0; overflow: hidden; }
    #app svg { display: block; }
    #console { flex: 1; background: #0f0f23; color: #4ecca3; padding: 8px; font-size: 12px; overflow-y: auto; white-space: pre-wrap; min-height: 0; }
    #legend { padding: 8px; color: #888; font-size: 11px; border-bottom: 1px solid #333; }
  </style>
</head>
<body>
  <div class="left">
    <div id="controls">
      <button id="btn-load-json">Load JSON</button>
      <button id="btn-size-a4">A4</button>
      <button id="btn-size-a3">A3</button>
      <button id="btn-gesture-click">Click</button>
      <button id="btn-gesture-rect">Rect</button>
      <button id="btn-gesture-lasso">Lasso</button>
      <button id="btn-mode-v">Mode: element</button>
      <button id="btn-mode-g">Mode: group</button>
      <button id="btn-toggle-pan">Pan: off</button>
    </div>
    <div id="app"></div>
  </div>
  <div class="right">
    <div id="legend">V — element · G — group · Shift+drag — rect · L — lasso · Space — pan · Ctrl — toggle</div>
    <div id="console">// ready</div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
